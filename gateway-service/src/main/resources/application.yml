server:
  port: 8888
agent:
  gateway:
    enabled: false
spring:
  config:
    import: optional:configserver:http://localhost:9888
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true # 自动创建基于 Eureka 的路由
              lower-case-service-id: true
    loadbalancer:
      retry:
        enabled: true
