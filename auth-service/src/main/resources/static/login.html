<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>
</head>
<body>
	<h2>Login</h2>

	<form id="loginForm">
		<label>User ID: <input type="text" name="userId" value="admin"></label><br>
		<br> <label>Password: <input type="password" name="password"
			value="123456"></label><br>
		<br>
		<button type="submit">Login</button>
	</form>

	<h3>Cookie:</h3>
	<pre id="cookieDisplay">Not logged in.</pre>

	<script>
    const form = document.getElementById('loginForm');
    const cookieDisplay = document.getElementById('cookieDisplay');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const formData = new FormData(form);
        const data = {
            userId: formData.get('userId'),
            password: formData.get('password')
        };

        try {
            const res = await fetch('http://localhost:8888/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data),
                credentials: 'include'
            });

            if (res.ok) {
                alert('Login succeeded.');
                window.location.replace('/home.html');
            } else {
                alert('Login failed.');
            }

            cookieDisplay.textContent = document.cookie || 'No readable cookie.';
        } catch (err) {
            console.error(err);
        }
    });
</script>

</body>
</html>
