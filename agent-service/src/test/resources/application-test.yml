spring:
  application:
    name: agent-service
  cloud:
    config:
      enabled: false
    openfeign:
      client:
        config:
          employee-service:
            connect-timeout: 500
            read-timeout: 2000
            logger-level: none
          mq-procedure-service:
            connect-timeout: 500
            read-timeout: 2000
            logger-level: none
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration
  sql:
    init:
      mode: never

eureka:
  client:
    enabled: false

mybatis:
  configuration:
    map-underscore-to-camel-case: true

agent:
  adapters:
    employee:
      max-response-bytes: 2097152
  intent-roles:
    QUERY: [agent:viewer, agent:admin]
    CLARIFY: [agent:viewer, agent:admin]
    AGGREGATE: [agent:viewer, agent:admin]
  runtime:
    base-url: http://localhost:9230
    connect-timeout: 2s
    read-timeout: 15s
    max-response-bytes: 65536
    shared-key: test-test-test-test-1234-shared-key
  auth-service:
    base-url: http://auth-service
    resolve-path: /internal/agent/permissions/resolve
    connect-timeout: 500ms
    read-timeout: 2s
    agent-id: agent-default
    profile-id: profile-v1
    scope-type: CONVERSATION
    scope-id: agent-permission-authority
  conversation:
    recent-turn-limit: 6
    retention-days: 7
    cleanup-delay: 1h
  query:
    default-size: 20
    max-size: 100
    max-result-window: 10000
    max-filters: 5
    max-in-values: 20
    max-filter-value-length: 256
    max-downstream-response-bytes: 2097152
  aggregate:
    max-metrics: 5
    max-group-fields: 2
    default-max-rows: 20
    max-max-rows: 100

common:
  security:
    service-token:
      scopes: [agent.permission.resolve]
