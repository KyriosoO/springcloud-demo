spring:
  application:
    name: agent-service
  cloud:
    config:
      enabled: false
    openfeign:
      client:
        config:
          employee-service:
            connect-timeout: 500
            read-timeout: 2000
            logger-level: none
          mq-procedure-service:
            connect-timeout: 500
            read-timeout: 2000
            logger-level: none
          es-query-service:
            connect-timeout: 500
            read-timeout: 2000
            logger-level: none
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration
  sql:
    init:
      mode: never

eureka:
  client:
    enabled: false

mybatis:
  configuration:
    map-underscore-to-camel-case: true

agent:
  document-profiles:
    owner-agent-id: agent-default
    owner-profile-version: profile-v1
    policy-version: policy-v1
    definitions:
      - profile-name: company-policy-v3
        domain: company_policy
        default-profile: true
        allowed-material-types: [company_policy]
        allowed-operations: [SEARCH, ANSWER, SUMMARIZE]
        allowed-channels: [BM25]
        required-channels: [BM25]
        generation-policy: {SEARCH: DISABLED, ANSWER: OPTIONAL, SUMMARIZE: OPTIONAL}
      - profile-name: tax-policy-v3
        domain: tax_policy
        default-profile: true
        allowed-material-types: [tax_policy]
        allowed-operations: [SEARCH, ANSWER, SUMMARIZE]
        allowed-channels: [BM25]
        required-channels: [BM25]
        generation-policy: {SEARCH: DISABLED, ANSWER: OPTIONAL, SUMMARIZE: OPTIONAL}
      - profile-name: knowledge-base-v3
        domain: knowledge_base
        default-profile: true
        allowed-material-types: [knowledge_base]
        allowed-operations: [SEARCH, ANSWER, SUMMARIZE]
        allowed-channels: [BM25]
        required-channels: [BM25]
        generation-policy: {SEARCH: DISABLED, ANSWER: OPTIONAL, SUMMARIZE: OPTIONAL}
      - profile-name: literature-v3
        domain: literature
        default-profile: true
        allowed-material-types: [literature]
        allowed-operations: [SEARCH, ANSWER, SUMMARIZE]
        allowed-channels: [BM25]
        required-channels: [BM25]
        generation-policy: {SEARCH: DISABLED, ANSWER: OPTIONAL, SUMMARIZE: OPTIONAL}
    policy:
      - domain: company_policy
        allowed-profile-names: [company-policy-v3]
        allowed-channels: [BM25]
        allowed-operations: [SEARCH, ANSWER, SUMMARIZE]
      - domain: tax_policy
        allowed-profile-names: [tax-policy-v3]
        allowed-channels: [BM25]
        allowed-operations: [SEARCH, ANSWER, SUMMARIZE]
      - domain: knowledge_base
        allowed-profile-names: [knowledge-base-v3]
        allowed-channels: [BM25]
        allowed-operations: [SEARCH, ANSWER, SUMMARIZE]
      - domain: literature
        allowed-profile-names: [literature-v3]
        allowed-channels: [BM25]
        allowed-operations: [SEARCH, ANSWER, SUMMARIZE]
  adapters:
    employee:
      max-response-bytes: 2097152
  intent-roles:
    QUERY: [agent:viewer, agent:admin]
    CLARIFY: [agent:viewer, agent:admin]
    AGGREGATE: [agent:viewer, agent:admin]
  runtime:
    base-url: http://localhost:9230
    connect-timeout: 2s
    read-timeout: 15s
    max-response-bytes: 65536
    shared-key: test-test-test-test-1234-shared-key
  auth-service:
    base-url: http://auth-service
    resolve-path: /internal/agent/permissions/resolve
    connect-timeout: 500ms
    read-timeout: 2s
  profile:
    agent-id: agent-default
    profile-version: profile-v1
    allowed-domains: [employee, transaction, company_policy, tax_policy, knowledge_base, literature]
  conversation:
    recent-turn-limit: 6
    retention-days: 7
    cleanup-delay: 1h
  query:
    default-size: 20
    max-size: 100
    max-result-window: 10000
    max-filters: 5
    max-in-values: 20
    max-filter-value-length: 256
    max-downstream-response-bytes: 2097152
  aggregate:
    max-metrics: 5
    max-group-fields: 2
    default-max-rows: 20
    max-max-rows: 100
  document:
    acl:
      scope-url: http://auth-service
      timeout: 2s

common:
  security:
    service-token:
      scopes: [agent.permission.resolve, agent.document.provider.invoke]
