server:
  port: 9220

spring:
  application:
    name: agent-service
  config:
    import: optional:configserver:http://localhost:9888
  profiles:
    active: datasource
  sql:
    init:
      mode: always
      schema-locations: classpath:db/agent-p0.sql
      continue-on-error: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  cloud:
    openfeign:
      client:
        config:
          employee-service:
            connect-timeout: 2000
            read-timeout: 10000
            logger-level: none
          mq-procedure-service:
            connect-timeout: 2000
            read-timeout: 10000
            logger-level: none

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    ip-address: 127.0.0.1
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

mybatis:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

agent:
  adapters:
    employee:
      max-response-bytes: 2097152
  intent-roles:
    QUERY: [agent:viewer, agent:admin]
    CLARIFY: [agent:viewer, agent:admin]
    AGGREGATE: [agent:viewer, agent:admin]
  runtime:
    base-url: http://localhost:9230
    connect-timeout: 2s
    read-timeout: 45s
    max-response-bytes: 65536
    shared-key: replace-with-at-least-16-characters
  conversation:
    recent-turn-limit: 6
    retention-days: 7
    cleanup-delay: 1h
  query:
    default-size: 20
    max-size: 100
    max-result-window: 10000
    max-filters: 5
    max-in-values: 20
    max-filter-value-length: 256
    max-downstream-response-bytes: 2097152
  aggregate:
    max-metrics: 5
    max-group-fields: 2
    default-max-rows: 20
    max-max-rows: 100
  domains:
    employee:
      aliases: [员工, employee]
      access-roles: [agent:viewer, agent:admin]
      default-select-fields:
        - chineseName
        - memberNo
        - position
      fields:
        chineseName:
          aliases: [姓名, 中文名, 员工姓名]
          type: STRING
          operators: [EQ, CONTAINS, CONTAINS_ANY, STARTS_WITH, STARTS_WITH_ANY, IN]
          filter-roles: [agent:viewer, agent:admin]
          display-roles: [agent:viewer, agent:admin]
          mask: NONE
        memberNo:
          aliases: [工号, 员工号]
          type: STRING
          operators: [EQ, CONTAINS, CONTAINS_ANY, STARTS_WITH, STARTS_WITH_ANY, IN]
          filter-roles: [agent:viewer, agent:admin]
          display-roles: [agent:viewer, agent:admin]
          mask: NONE
        position:
          aliases: [岗位, 职位]
          type: STRING
          operators: [EQ, CONTAINS, CONTAINS_ANY, STARTS_WITH, STARTS_WITH_ANY, IN]
          filter-roles: [agent:viewer, agent:admin]
          display-roles: [agent:viewer, agent:admin]
          mask: NONE
        contactAddress:
          aliases: [联系地址, 地址]
          type: STRING
          operators: [EQ, CONTAINS, CONTAINS_ANY, STARTS_WITH, STARTS_WITH_ANY, IN]
          filter-roles: [agent:admin]
          display-roles: [agent:admin]
          mask: ADDRESS
        idCardNo:
          aliases: [身份证号, 身份证]
          type: STRING
          operators: [EQ, CONTAINS, CONTAINS_ANY, STARTS_WITH, STARTS_WITH_ANY, IN]
          filter-roles: [agent:admin]
          display-roles: [agent:admin]
          mask: ID_CARD
        phoneNo:
          aliases: [手机号, 电话]
          type: STRING
          operators: [EQ, CONTAINS, CONTAINS_ANY, STARTS_WITH, STARTS_WITH_ANY, IN]
          filter-roles: [agent:admin]
          display-roles: [agent:admin]
          mask: MOBILE
        email:
          aliases: [邮箱, 电子邮箱]
          type: STRING
          operators: [EQ, CONTAINS, CONTAINS_ANY, STARTS_WITH, STARTS_WITH_ANY, IN]
          filter-roles: [agent:admin]
          display-roles: [agent:admin]
          mask: EMAIL
    transaction:
      aliases: [交易, 交易记录, 交易流水, transaction]
      access-roles: [agent:viewer, agent:admin]
      default-select-fields:
        - transId
        - transType
        - transDate
        - amount
      fields:
        transId:
          aliases: [交易号, 交易ID, 流水号]
          type: STRING
          operators: [EQ]
          filter-roles: [agent:viewer, agent:admin]
          display-roles: [agent:viewer, agent:admin]
          mask: NONE
        transType:
          aliases: [交易类型, 类型]
          type: STRING
          operators: [EQ, CONTAINS]
          filter-roles: [agent:viewer, agent:admin]
          display-roles: [agent:viewer, agent:admin]
          mask: NONE
        transDate:
          aliases: [交易时间, 交易日期, 时间]
          type: INSTANT
          format-hint: ISO-8601 datetime with timezone, second precision only, no fractional seconds
          operators: [GT, LT]
          filter-roles: [agent:viewer, agent:admin]
          display-roles: [agent:viewer, agent:admin]
          mask: NONE
        amount:
          aliases: [金额, 交易金额]
          type: DECIMAL
          format-hint: plain decimal only, precision 50, scale 2, no exponent
          decimal-precision: 50
          decimal-scale: 2
          operators: [EQ, GT, LT]
          filter-roles: [agent:viewer, agent:admin]
          display-roles: [agent:viewer, agent:admin]
          mask: NONE
