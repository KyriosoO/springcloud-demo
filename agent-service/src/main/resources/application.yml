server:
  port: 0

spring:
  application:
    name: agent-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
    service-registry:
      auto-registration:
        enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

agent:
  security:
    auth:
      base-url: http://localhost:8090
      resolve-path: /internal/agent/permissions/resolve
      connect-timeout: 2s
      read-timeout: 2s
      max-response-bytes: 65536
      positive-cache-enabled: false
    policy:
      required: true
      persistence-enabled: false
    auth-field-migration-mode: SEED_ONLY

common:
  security:
    service-token:
      service-id: agent-service
      scopes: [agent.permission.resolve]
