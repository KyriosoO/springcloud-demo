server:
  port: 9220

spring:
  application:
    name: agent-service
  config:
    import: optional:configserver:http://localhost:9888
  profiles:
    active: datasource,ai-provider,agent-document
  sql:
    init:
      mode: always
      schema-locations: classpath:db/agent-p0.sql
      continue-on-error: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  cloud:
    openfeign:
      client:
        config:
          employee-service:
            connect-timeout: 2000
            read-timeout: 10000
            logger-level: none
          mq-procedure-service:
            connect-timeout: 2000
            read-timeout: 10000
            logger-level: none
          es-query-service:
            connect-timeout: 2000
            read-timeout: 10000
            logger-level: none

mybatis:
  configuration:
    map-underscore-to-camel-case: true

agent:
  kernel:
    enabled: true
  adapters:
    employee:
      max-response-bytes: 2097152
  runtime:
    base-url: http://localhost:9230
    connect-timeout: 2s
    read-timeout: 45s
    max-response-bytes: 65536
    shared-key: replace-with-at-least-16-characters
    route-path: /runtime/v1/route
    plan-path: /runtime/v1/plan
    max-repair-attempts: 1
  auth-service:
    base-url: http://localhost:8090
    resolve-path: /internal/agent/permissions/resolve
    connect-timeout: 2s
    read-timeout: 2s
    agent-id: agent-default
    profile-id: profile-v1
    scope-type: CONVERSATION
    scope-id: agent-permission-authority
  conversation:
    recent-turn-limit: 6
    retention-days: 7
    cleanup-delay: 1h
  query:
    default-size: 20
    max-size: 100
    max-result-window: 10000
    max-filters: 5
    max-in-values: 20
    max-filter-value-length: 256
    max-downstream-response-bytes: 2097152
  aggregate:
    max-metrics: 5
    max-group-fields: 2
    default-max-rows: 20
    max-max-rows: 100

common:
  security:
    service-token:
      scopes: [agent.permission.resolve, agent.document.provider.invoke]
