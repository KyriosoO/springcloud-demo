[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-service"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.139.2",
  "httpx==0.28.1",
  "langgraph==1.2.9",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "PyJWT==2.13.0",
  "uvicorn==0.51.0",
]

[project.optional-dependencies]
test = [
  "hypothesis==6.161.0",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.15.22",
]

[tool.hatch.build.targets.wheel]
packages = ["agent_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agent_service"]
