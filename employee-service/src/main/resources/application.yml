server:
  port: 9210

spring:
  application:
    name: employee-service
  config:
    import: optional:configserver:http://localhost:9888
  profiles:
    active: datasource,emp

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info

workflow:
  action:
    topic: workflow-action-employee-topic

employee:
  approval:
    mode: workflow
  workflow:
    action-group: employee-workflow-action-group
    inbox-retry-delay-ms: 5000
