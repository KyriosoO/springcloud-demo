server:
  port: 9100

spring:
  application:
    name: workflow-service
  config:
    import: optional:configserver:http://localhost:9888
  profiles:
    active: datasource

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info

workflow:
  action:
    dispatchers:
      - log
      - kafka
    topic: workflow-action-@-topic
    outbox-retry-delay-ms: 5000
