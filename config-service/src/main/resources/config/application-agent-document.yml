agent:
  document:
    acl:
      scope-url: http://auth-service
      timeout: 2s
      max-authority-evidence-ttl: 30m
      final-decision-max-age: 2s
      max-departments: 128
      max-roles: 128
      max-attributes: 128
      max-allowed-document-ids: 512
      max-denied-document-ids: 512
      max-ast-nodes: 64
      max-ast-depth: 8
      max-terms: 1024
      max-canonical-bytes: 131072
      max-wire-bytes: 262144
      max-currentness-candidates: 200
  document-provider-adapter:
    base-url: http://document-provider-adapter
    connect-timeout: 1s
    read-timeout: 15s
    max-request-bytes: 2000000
    max-response-bytes: 2000000
  document-profiles:
    owner-agent-id: agent-default
    owner-profile-version: profile-v1
    policy-version: policy-v1
    definitions:
      - profile-name: company-policy-v3
        domain: company_policy
        default-profile: true
        allowed-material-types: [company_policy]
        allowed-operations: [SEARCH, ANSWER, SUMMARIZE]
        allowed-channels: [BM25, EXACT_PHRASE]
        required-channels: [BM25, EXACT_PHRASE]
        keyword-k: 30
        max-chunks-per-document: 2
        rewrite-policy: DISABLED
        embedding-policy: DISABLED
        rerank-policy: DISABLED
        generation-policy: {SEARCH: DISABLED, ANSWER: OPTIONAL, SUMMARIZE: OPTIONAL}
        searchable-fields: [title, sourceType, effectiveDate, tags, section, page, sourceUri, snippet]
        returnable-fields: [title, sourceType, effectiveDate, tags, section, page, sourceUri, snippet]
      - profile-name: tax-policy-v3
        domain: tax_policy
        default-profile: true
        allowed-material-types: [tax_policy]
        allowed-operations: [SEARCH, ANSWER, SUMMARIZE]
        allowed-channels: [BM25, EXACT_PHRASE, DENSE_VECTOR]
        required-channels: [BM25, EXACT_PHRASE, DENSE_VECTOR]
        keyword-k: 60
        vector-k: 60
        rrf-k: 60
        num-candidates: 180
        max-chunks-per-document: 2
        rewrite-policy: OPTIONAL
        embedding-policy: REQUIRED
        rerank-policy: OPTIONAL
        generation-policy: {SEARCH: DISABLED, ANSWER: OPTIONAL, SUMMARIZE: OPTIONAL}
        searchable-fields: [title, sourceType, effectiveDate, tags, section, page, sourceUri, snippet]
        returnable-fields: [title, sourceType, effectiveDate, tags, section, page, sourceUri, snippet]
      - profile-name: knowledge-base-v3
        domain: knowledge_base
        default-profile: true
        allowed-material-types: [knowledge_base]
        allowed-operations: [SEARCH, ANSWER, SUMMARIZE]
        allowed-channels: [BM25, EXACT_PHRASE]
        required-channels: [BM25, EXACT_PHRASE]
        rewrite-policy: DISABLED
        embedding-policy: DISABLED
        rerank-policy: DISABLED
        generation-policy: {SEARCH: DISABLED, ANSWER: OPTIONAL, SUMMARIZE: OPTIONAL}
        searchable-fields: [title, sourceType, effectiveDate, tags, section, page, sourceUri, snippet]
        returnable-fields: [title, sourceType, effectiveDate, tags, section, page, sourceUri, snippet]
      - profile-name: literature-v3
        domain: literature
        default-profile: true
        allowed-material-types: [literature]
        allowed-operations: [SEARCH, ANSWER, SUMMARIZE]
        allowed-channels: [BM25, EXACT_PHRASE]
        required-channels: [BM25, EXACT_PHRASE]
        rewrite-policy: DISABLED
        embedding-policy: DISABLED
        rerank-policy: DISABLED
        generation-policy: {SEARCH: DISABLED, ANSWER: OPTIONAL, SUMMARIZE: OPTIONAL}
        searchable-fields: [title, sourceType, effectiveDate, tags, section, page, sourceUri, snippet]
        returnable-fields: [title, sourceType, effectiveDate, tags, section, page, sourceUri, snippet]
    policy:
      - domain: company_policy
        allowed-profile-names: [company-policy-v3]
        allowed-channels: [BM25, EXACT_PHRASE]
        allowed-operations: [SEARCH, ANSWER, SUMMARIZE]
      - domain: tax_policy
        allowed-profile-names: [tax-policy-v3]
        allowed-channels: [BM25, EXACT_PHRASE, DENSE_VECTOR]
        allowed-operations: [SEARCH, ANSWER, SUMMARIZE]
      - domain: knowledge_base
        allowed-profile-names: [knowledge-base-v3]
        allowed-channels: [BM25, EXACT_PHRASE]
        allowed-operations: [SEARCH, ANSWER, SUMMARIZE]
      - domain: literature
        allowed-profile-names: [literature-v3]
        allowed-channels: [BM25, EXACT_PHRASE]
        allowed-operations: [SEARCH, ANSWER, SUMMARIZE]
