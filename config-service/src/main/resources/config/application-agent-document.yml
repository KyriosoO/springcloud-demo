agent:
  document:
    rewrite:
      enabled: true
      path: /runtime/v1/document/rewrite
      language: zh-CN
      max-candidates: 3
      max-candidate-length: 128
      timeout: 2s	
    enabled: true
    default-size: 5
    default-retrieval-mode: HYBRID
    retrieval-mode-by-domain:
      company_policy: HYBRID
      tax_policy: HYBRID
      knowledge_base: HYBRID
      literature: HYBRID
    answer-candidate-size: 20
    summarize-candidate-size: 20
    max-size: 20
    max-evidence-count: 8
    max-query-text-length: 500
    max-snippet-chars: 500
    max-summary-chars: 2000
    evidence-selection:
      strategy: SCORE_GROUP_TOP
      score-groups: 3
      min-top-group-size: 1
    context-window:
      enabled: true
      before-chunks: 5
      after-chunks: 5
    acl:
      enabled: true
      scope-url: http://localhost:9220
      timeout: 2s
      mock:
        enabled: true
    embedding:
      enabled: true
      base-url: ${ai.provider.embedding.bge.base-url}
      model: ${ai.provider.embedding.bge.model}
      dimension: ${ai.provider.embedding.bge.dimension}
      timeout: 5s
    generation:
      enabled: true
      base-url: http://localhost:9240
      model: ${ai.provider.generation.deepseek.model}
      max-context-chars: 8000
      max-evidence-chars: 1200
      max-output-chars: 2000
      timeout: 60s
      failure-policy: FALLBACK_EXTRACTIVE
    rerank:
      enabled: true
      base-url: http://127.0.0.1:8909
      path: /rerank
      model: BAAI/bge-reranker-v2-m3
      normalize: true
      max-document-chars: 1200
      timeout: 5s
    hybrid:
      keyword-k: 20
      vector-k: 20
      rrf-k: 60
      num-candidates: 100
    retrieval-profiles:
      tax-policy-v2:
        enabled: true
        domain: tax_policy
        material-types: [tax_policy]
        retrieval-profile: tax_policy_v2_default
        index-alias: agent-doc-tax-policy-v2-read
        channels: [BM25, EXACT, PHRASE, DENSE_VECTOR]
        channel-weights:
          BM25: 1.0
          EXACT: 1.8
          PHRASE: 1.4
          DENSE_VECTOR: 1.0
        embedding-field: embedding
        embedding-provider: bge
        embedding-model: ${ai.provider.embedding.bge.model}
        embedding-dimension: ${ai.provider.embedding.bge.dimension}
        keyword-k: 40
        exact-k: 20
        phrase-k: 30
        vector-k: 40
        rrf-k: 60
        num-candidates: 200
        max-chunks-per-document: 2
        rerank:
          enabled: true
          top-n: 20
  document-adapter:
    index-by-domain:
      company_policy: agent-doc-company-policy
      tax_policy: agent-doc-tax-policy-v2-read
      knowledge_base: agent-doc-knowledge-base
      literature: agent-doc-literature
