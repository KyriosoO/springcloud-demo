document-corpus:
  definitions:
    - { domain: company_policy, material-type: company_policy, read-alias: agent-doc-company-policy-read, schema-name: document-chunk, schema-version: "3.0.0", schema-digest: 3333333333333333333333333333333333333333333333333333333333333333, analyzer-ref: document-zh-v3, vector-policy-ref: bge-v3, chunk-strategy-ref: char-window-v3, source-connector-id: document-platform }
    - { domain: tax_policy, material-type: tax_policy, read-alias: agent-doc-tax-policy-read, schema-name: document-chunk, schema-version: "3.0.0", schema-digest: 3333333333333333333333333333333333333333333333333333333333333333, analyzer-ref: document-zh-v3, vector-policy-ref: bge-v3, chunk-strategy-ref: char-window-v3, source-connector-id: document-platform }
    - { domain: knowledge_base, material-type: knowledge_base, read-alias: agent-doc-knowledge-base-read, schema-name: document-chunk, schema-version: "3.0.0", schema-digest: 3333333333333333333333333333333333333333333333333333333333333333, analyzer-ref: document-zh-v3, vector-policy-ref: bge-v3, chunk-strategy-ref: char-window-v3, source-connector-id: document-platform }
    - { domain: literature, material-type: literature, read-alias: agent-doc-literature-read, schema-name: document-chunk, schema-version: "3.0.0", schema-digest: 3333333333333333333333333333333333333333333333333333333333333333, analyzer-ref: document-zh-v3, vector-policy-ref: bge-v3, chunk-strategy-ref: char-window-v3, source-connector-id: document-platform }

document-rebuild:
  page-size: 200
  max-bulk-attempts: 3
  chunk-window-code-points: 1200
  chunk-overlap-code-points: 200
  max-document-code-points: 2000000
  lease-duration: 30s
  task-timeout: 2h
  poll-delay: 2s

es:
  clients:
    generic:
      uris: ["${ES_GENERIC_URIS:http://127.0.0.1:9200}"]
      username: ${ES_GENERIC_USERNAME:}
      password: ${ES_GENERIC_PASSWORD:}
      role-ref: generic-index-role
    document:
      uris: ["${ES_DOCUMENT_URIS:http://127.0.0.1:9200}"]
      username: ${ES_DOCUMENT_USERNAME:}
      password: ${ES_DOCUMENT_PASSWORD:}
      role-ref: document-index-role
  query:
    total-hits-threshold: 10000
    document-index-prefixes: [agent-doc-]
    document-source-allowed-hosts: [document-platform]
    rebuild-max-batch-size: 500
    management-service-token: ${ES_QUERY_MANAGEMENT_SERVICE_TOKEN:}
