management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    env:
      keys-to-sanitize: common.security.secrets.*,COMMON_SECURITY_JWT_HMAC_KEY_*,*.secret*,*.password*,*.token*,*.key*
    configprops:
      keys-to-sanitize: common.security.secrets.*,COMMON_SECURITY_JWT_HMAC_KEY_*,*.secret*,*.password*,*.token*,*.key*

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

common:
  security:
    secrets:
      source-order: [config, environment]
      allow-config-values: true
      fail-fast: true
      jwt:
        active-key-id: ACTIVE
        previous-key-ids: []
        keys:
          ACTIVE:
            env: COMMON_SECURITY_JWT_HMAC_KEY_ACTIVE
            value: "2muGRGWD4+2iCicGq3d02FEYojKGi9k9GwJDcMQkbds="
