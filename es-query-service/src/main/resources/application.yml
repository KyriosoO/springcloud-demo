server:
  port: 9201

spring:
  application:
    name: es-query-service
  config:
    import: optional:configserver:http://localhost:9888
  profiles:
    active: datasource,es

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info

es:
  query:
    total-hits-threshold: 10000
    document-index-prefixes:
      - agent-doc-
    document-source-allowed-hosts:
      - document-platform
    rebuild-max-batch-size: 500
    management-service-token: ${ES_QUERY_MANAGEMENT_SERVICE_TOKEN:}
