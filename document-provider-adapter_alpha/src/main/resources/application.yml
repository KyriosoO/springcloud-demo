server:
  port: 9240
spring:
  application:
    name: document-provider-adapter
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
  config:
    import: optional:configserver:http://localhost:9888
common:
  security:
    service-token:
      scopes: [agent.document.provider.activation]
document-provider:
  operation:
    max-stage-horizon: 30s
    max-items: 512
    max-text-chars: 100000
    max-total-text-chars: 1000000
    max-embedding-dimension: 8192
    max-request-bytes: 2000000
  activation-feed:
    base-url: http://agent-service
    consumer-id: document-provider-adapter
    deployment-digest: ${DOCUMENT_PROVIDER_DEPLOYMENT_DIGEST:}
    refresh-delay: 1s
    max-distribution-staleness: 5s
