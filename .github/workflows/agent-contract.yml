# Agent contract CI gates.
name: Agent Contract CI

on:
  push:
    branches: [master, codex]
    paths:
      - 'agent-api/**'
      - 'agent-service/**'
      - 'agent-adapter-api/**'
      - 'agent-adapter-employee/**'
      - 'agent-adapter-transaction/**'
      - 'agent-runtime/**'
      - 'serviceCenter/pom.xml'
      - 'serviceCenter/mvnw'
      - '.github/workflows/agent-contract.yml'
  pull_request:
    branches: [master, codex]
    paths:
      - 'agent-api/**'
      - 'agent-service/**'
      - 'agent-adapter-api/**'
      - 'agent-adapter-employee/**'
      - 'agent-adapter-transaction/**'
      - 'agent-runtime/**'
      - 'serviceCenter/pom.xml'
      - 'serviceCenter/mvnw'
      - '.github/workflows/agent-contract.yml'

jobs:
  java-contract:
    name: Java Contract Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: serviceCenter
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Maven compile and test agent modules
        run: >
          ./mvnw
          -pl ../agent-api,../agent-service,../agent-adapter-api,../agent-adapter-employee,../agent-adapter-transaction
          -am
          test
          --batch-mode
          --no-transfer-progress

      - name: OpenAPI drift check
        run: >
          ./mvnw
          -pl ../agent-api
          -am
          test
          --batch-mode
          --no-transfer-progress
        env:
          MAVEN_OPTS: '-Dagent.contract.update=false'

  python-contract:
    name: Python Contract Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-runtime
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent-runtime/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Generated model drift check
        run: python scripts/check_contract_drift.py

      - name: Contract fixture and semantic tests
        run: python -m pytest tests/test_contracts.py -v

      - name: Planning validation tests
        run: python -m pytest tests/test_planning.py -v

      - name: Prompt contract tests
        run: python -m pytest tests/test_prompt_contract.py -v
