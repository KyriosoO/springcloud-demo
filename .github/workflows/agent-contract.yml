# Target baseline CI gates. Historical contract CI is retained outside .github/workflows.
name: Agent Target Baseline CI

on:
  push:
    branches: [master, codex]
  pull_request:
    branches: [master, codex]

jobs:
  active-boundary:
    name: Active boundary checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject historical namespace in active entries
        shell: bash
        run: |
          suffix="_""alpha"
          exclusions=(
            ':(exclude)docs/**'
            ':(exclude)scripts/verify-agent-baseline-isolation.ps1'
            ':(exclude)scripts/verify-agent-external-consumer-exit.ps1'
          )
          historical_roots=(
            agent-adapter-api agent-adapter-document agent-adapter-employee agent-adapter-transaction
            agent-api agent-runtime agent-service es-query-api es-query-service
            document-provider-adapter document-generation-adapter
          )
          for root in "${historical_roots[@]}"; do
            exclusions+=(":(exclude)${root}${suffix}/**")
          done
          if git grep -n "$suffix" -- . "${exclusions[@]}"; then
            echo "historical namespace is forbidden in active build, startup, and CI entries"
            exit 1
          fi

  java-contract:
    name: Java target and contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: serviceCenter
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Test target Java modules
        run: >
          ./mvnw
          -pl ../agent-api,../agent-adapter-api,../agent-adapter-document,../agent-adapter-employee,../agent-adapter-transaction,../agent-service,../es-query-api,../es-query-service,../document-provider-adapter
          -am
          test
          --batch-mode
          --no-transfer-progress

  python-contract:
    name: Python contract and target runtime
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-runtime
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked contract toolchain
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Check generated contract artifacts
        working-directory: .
        run: python scripts/agent-contract/govern_agent_runtime_contract.py --check
      - name: Test runtime and contract
        run: python -m unittest discover -s tests -v
